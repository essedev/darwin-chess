[project]
name = "darwin"
version = "0.1.0"
description = "An LLM agent evolves a chess engine; a trusted referee judges every generation."
authors = [
    { name = "Simone Salerno", email = "doppiaesse@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.14.0",
    "chess>=1.11.2",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # not the local migrations folder

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
mypy_path = "../anchors"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "docker: runs real containers; needs `make images`",
    "llm: calls the paid model; only in explicit runs",
]
addopts = "-m 'not llm'"
