# Production on server: `core` and `api` are long-lived; everything else (sandboxes, builds,
# arena, engines, jobs) is started by core as short-lived containers.
# DARWIN_HOME (absolute, in .env) holds data/ and genome/; they are mounted at the same path
# as on the host so the containers core starts resolve the same bind mounts.

x-darwin-env: &darwin-env
  DARWIN_INSTANCE: prod
  DARWIN_DATA_DIR: ${DARWIN_HOME:?set DARWIN_HOME in .env to the absolute repository path}/data
  DARWIN_GENOME_DIR: ${DARWIN_HOME}/genome
  DARWIN_MIRROR_DIR: ${DARWIN_HOME}/data/mirror.git
  # The ledger lives in a Docker volume, not in the bind-mounted data/: SQLite in WAL mode
  # shares memory between connections, which Docker Desktop's file sharing does not keep
  # coherent (connections saw each other's rows late or not at all).
  DARWIN_LEDGER_URL: sqlite+aiosqlite:////ledger/ledger.sqlite

services:
  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: darwin-backend
    profiles: [run]
    env_file: .env  # DARWIN_LLM_API_KEY
    environment: *darwin-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DARWIN_HOME}/data:${DARWIN_HOME}/data
      - ${DARWIN_HOME}/genome:${DARWIN_HOME}/genome
      - ledger:/ledger
    restart: unless-stopped
    # Room for an orderly stop (see orchestrator/__main__.py) before Docker kills it.
    stop_grace_period: 30s

  api:
    image: darwin-backend
    profiles: [run]
    command: ["uvicorn", "darwin.api.app:app", "--host", "0.0.0.0", "--port", "4730"]
    environment: *darwin-env
    volumes:
      - ${DARWIN_HOME}/data:${DARWIN_HOME}/data:ro
      # Not :ro: SQLite readers in WAL mode write the shared-memory index. The API code
      # never writes the ledger.
      - ledger:/ledger
    ports:
      # Only this machine: the public reaches it through the tunnel, on the Compose network.
      - "127.0.0.1:4730:4730"
    restart: unless-stopped

  # Publishes the dashboard on darwin.esse.dev through a Cloudflare Tunnel, without opening
  # ports. Its own profile: it needs the tunnel credentials made once with `cloudflared
  # tunnel login` / `create` in ~/.cloudflared (see docs/ARCHITECTURE.md, Deploy).
  tunnel:
    image: cloudflare/cloudflared:2026.11.2
    profiles: [public]
    command: ["tunnel", "--no-autoupdate", "--config", "/home/nonroot/.cloudflared/config.yml", "run"]
    volumes:
      - ${HOME}/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on: [api]
    restart: unless-stopped

volumes:
  ledger:
