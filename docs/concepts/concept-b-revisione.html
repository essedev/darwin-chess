		<title>Concept B - revisione</title>
		<!--
			Concept B: come Diretta ed Evoluzione raccontano lo stato del laboratorio senza liste
			infinite, senza ripetere la stessa ipotesi tre volte e con un Elo che non mente.
			Tasti: x a b c per la variante, t tema, p nasconde la barra. Dentro il mock la barra di
			navigazione funziona (Diretta, Evoluzione) e così IT | EN; le altre voci sono inerti.

			Il problema (sito vero, 25 novembre 2026, gen-5, 18 esperimenti):
			- i titoli sono paragrafi: l'ipotesi dell'agente (300-400 caratteri, gergo: "go mover",
			  "perft", "movegen") fa da titolo in quattro posti;
			- la stessa ipotesi di #18 compare tre volte nella Diretta (riga in gara a sinistra,
			  scheda "Che cosa sta giudicando" a destra, lista sotto la scacchiera);
			- liste senza fine: 7 giudizi e 20 partite Lichess sotto la scacchiera, 18 esperimenti
			  a schermo intero in Evoluzione; la Diretta arriva a circa 2.600 px;
			- l'Elo contraddice se stesso: 1.193, 1.162, 1.129 (la curva scende) mentre ogni
			  generazione dichiara +24 e +42. I margini veri sono ± 139, ± 118, ± 136: le tre
			  misure si sovrappongono, il calo non esiste, ma il sito non lo dice;
			- gen-3 "+667 Elo" viene da 24 partite, ± 962; gen-1 ha "2.554 di performance" su
			  Lichess da una partita sola;
			- le lezioni sono gergo ("a distinct eval term avoids overlapping the pending...");
			- nella Diretta il nome del sito non è nella barra (sta nella top bar della pagina).

			X  oggi: la replica del sito di oggi, Diretta ed Evoluzione.
			A  Dieta: stessa struttura di oggi, ogni blocco a dieta. Scommessa: il layout regge, il
			   problema è la quantità e la scrittura. È il piano A-F discusso in chat.
			B  Palco: la Diretta ha due colonne, la partita e un solo riquadro "il laboratorio
			   adesso"; la storia esce dalla Diretta e vive in Evoluzione, dove gli esperimenti
			   stanno dentro la generazione che hanno prodotto. Scommessa: chi arriva vuole la
			   partita e una risposta a "come va", la storia è una pagina a sé.
			C  Cronaca: una colonna sola, una frase di stato in testa, tre numeri, la scacchiera,
			   poi un unico filo cronologico di quello che è successo oggi (verdetti, promozioni,
			   partite Lichess). Evoluzione come quaderno: grafico onesto e una tabella filtrabile.
			   Scommessa: il sito si legge come un notiziario, da telefono prima che da desktop.

			Uguale in A, B, C (deciso in chat, non è l'asse delle varianti):
			- "darwin-chess" sempre nella barra;
			- titoli brevi bilingue per ogni esperimento (al massimo 8 parole, scritti dall'agente
			  al submit; per i 18 passati li scrive Haiku una volta). L'ipotesi lunga resta nei
			  dettagli, in italiano tradotto;
			- Elo onesto: il numero principale è l'assoluto con il suo margine al 95%; il grafico
			  ha le barre d'errore; il guadagno sul campione precedente è secondario e spiegato;
			- performance Lichess mostrata solo da 5 partite in su;
			- la lezione diventa "Nota dell'agente", nei dettagli, con le sue parole tradotte.

			Mappatura sul codice di oggi (fattibilità, non piano):
			- margini dell'Elo assoluto: rating_snapshots.elo_error esiste, l'API non lo espone
			  (overview e generations/detail danno solo elo_absolute): un campo in più;
			- titoli brevi: nuovo campo experiments.title / title_it, submit lo chiede, backfill
			  una tantum con Haiku (stima: 18 chiamate, meno di un centesimo);
			- filtri e pagine in Evoluzione: /api/experiments ha già limit e before_id, serve un
			  filtro per stato (o si filtra lato client sulle pagine caricate);
			- B raggruppa gli esperimenti per generazione: base_commit c'è, il gruppo si ricava
			  (gli esperimenti fra la promozione di gen-N e quella di gen-N+1);
			- C mescola verdetti e partite Lichess in un filo: due query già esistenti, unite e
			  ordinate lato client;
			- avanzamento del match in corso (partite giocate, LLR parziale): oggi la diretta ha
			  solo il conteggio della partita sul tabellone, l'LLR parziale non è pubblicato.

			Dati: veri dall'API pubblica e dal registro su server (25/11/2026, 15:00 circa):
			generazioni, Elo e margini, match, costi, partite Lichess, pensiero dell'agente.
			Inventati: i titoli brevi (plausibili, scritti da me), l'avanzamento del match di #18
			(412 partite, V 150 P 120 S 142, LLR +0,8), le note dell'agente riscritte senza gergo
			nelle varianti. La posizione sulla scacchiera è legale (validata con python-chess); i
			pezzi cburnett vengono dal CDN di Lichess solo per il mock, come nel concept A.
			Verifica: Chromium via preview, 1440 px e 390 px, entrambi i temi.
		-->

			const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
			const plain = (s) => s.replace(/`/g, '');

			const STATUS = {
				judging: [['in giudizio', 'on trial'], 'live'],
				queued: [['in coda', 'queued'], 'mut'],
				accepted: [['promosso', 'promoted'], 'good'],
				rejected: [['scartato', 'rejected'], 'bad'],
				error: [['errore', 'error'], 'bad'],
				abandoned: [['nessuna consegna', 'nothing submitted'], 'mut'],
				stale: [['superato', 'overtaken'], 'mut'],
				rules: [['regole superate', 'rules passed'], 'good']
			};
			const GATE = { build: ['compila', 'builds'], perft: ['regole', 'rules'], smoke: ['partite pulite', 'clean games'], match: ['match', 'match'] };
			const RES = { win: [['Vinta', 'Won'], 'good'], draw: [['Patta', 'Draw'], 'mut'], loss: [['Persa', 'Lost'], 'bad'] };
			const pill = (st) => `<span class="pill ${STATUS[st][1]}">${tx(STATUS[st][0])}</span>`;
			const titleOf = (e) => (e.title ? tx(e.title) : T('Senza ipotesi', 'No hypothesis'));
			const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
			const ext = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';
			const why = (text) => `<button class="why" type="button" aria-label="${T('Spiegazione', 'Explanation')}">?<span class="tip" role="tooltip">${text}</span></button>`;

			// Board and game.
			function board() {
				const rows = FEN.split('/');
				let html = '';
				rows.forEach((row, r) => {
					let c = 0;
					for (const ch of row) {
						if (/\d/.test(ch)) { for (let k = 0; k < +ch; k++) html += sq(r, c++, null); }
						else html += sq(r, c++, ch);
					}
				});
				return `<div class="board" role="img" aria-label="${T('Scacchiera', 'Board')}">${html}</div>`;
			}
			function sq(r, c, p) {
				const name = 'abcdefgh'[c] + (8 - r);
				const cls = (r + c) % 2 === 0 ? 'l' : 'd';
				const hl = LAST.includes(name) ? ' hl' : '';
				const img = p ? `<img alt="" src="https://lichess1.org/assets/piece/cburnett/${p === p.toUpperCase() ? 'w' : 'b'}${p.toUpperCase()}.svg">` : '';
				return `<i class="${cls}${hl}">${img}</i>`;
			}
			function moves() {
				let rows = '';
				for (let i = 0; i < SAN.length; i += 2) {
					const last = i + 2 >= SAN.length;
					const w = SAN[i], b = SAN[i + 1];
					rows += `<div class="row"><span class="n">${i / 2 + 1}</span><span class="${last && !b ? 'cur' : ''}">${w}</span><span class="${last && b ? 'cur' : ''}">${b || ''}</span></div>`;
				}
				return `<div class="moves"><div data-scroll>${rows}</div></div>`;
			}
			function player(colour, name, sub, aside, tag) {
				return `<div class="player"><span class="stone ${colour}"></span><span style="min-width:0"><span style="display:flex;align-items:center;gap:6px">${tag ? `<span class="tag">${tag}</span>` : ''}<b class="trunc">${name}</b></span><span class="sub">${sub}</span></span>${aside ? `<span class="aside">${aside}</span>` : ''}</div>`;
			}
			function game(opts = {}) {
				const pts = (v) => `<b class="num">${v}</b><span class="sub">${T('vinte', 'won')}</span>`;
				const black = player('b', opts.blackName || T('Campione gen-5', 'Champion gen-5'), opts.blackSub || T('nero', 'black'), opts.points ? pts(RUN.l) : '');
				const white = player('w', opts.whiteName || T('Candidato #18', 'Candidate #18'), opts.whiteSub || T('bianco', 'white'), opts.points ? pts(RUN.w) : '');
				return `<div class="game">${black}<span class="spacer"></span><div>${board()}</div>${moves()}${white}</div>`;
			}

			// Elo: honest numbers and the chart with error bars.
			const RATED = GENS.filter((g) => g.abs !== null && !g.seed).slice().reverse();
			function eloChart(opts = {}) {
				const narrow = innerWidth < 600 && opts.axis;
				const W = narrow ? 360 : opts.w || 300, H = narrow ? 170 : opts.h || 120, padL = opts.axis ? 34 : 6, padR = 8, padT = 8, padB = opts.axis ? 22 : 8;
				const lo = 950, hi = 1350;
				const pts = RATED;
				const x = (i) => padL + ((W - padL - padR) * (i + 0.5)) / pts.length;
				const y = (v) => padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo));
				let s = '';
				if (opts.axis) [1000, 1100, 1200, 1300].forEach((v) => { s += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${n(v)}</text>`; });
				// The band where all three measures agree.
				const top = Math.min(...pts.map((p) => p.abs + p.absErr)), bot = Math.max(...pts.map((p) => p.abs - p.absErr));
				if (opts.band) s += `<rect class="band" x="${padL}" width="${W - padL - padR}" y="${y(top)}" height="${y(bot) - y(top)}" rx="3"/>`;
				s += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.abs)}`).join(' ')}"/>`;
				pts.forEach((p, i) => {
					s += `<line class="err" x1="${x(i)}" x2="${x(i)}" y1="${y(p.abs + p.absErr)}" y2="${y(p.abs - p.absErr)}"/>`;
					s += `<line class="err" x1="${x(i) - 5}" x2="${x(i) + 5}" y1="${y(p.abs + p.absErr)}" y2="${y(p.abs + p.absErr)}"/><line class="err" x1="${x(i) - 5}" x2="${x(i) + 5}" y1="${y(p.abs - p.absErr)}" y2="${y(p.abs - p.absErr)}"/>`;
					s += `<circle class="pt" cx="${x(i)}" cy="${y(p.abs)}" r="4"/>`;
					if (opts.axis) s += `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">gen-${p.id}</text>`;
				});
				return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${T('Elo contro Stockfish per generazione, con margine', 'Elo against Stockfish per generation, with margin')}">${s}</svg>`;
			}
			const ELO_TIP = () => T(
				'Misurato facendo giocare il campione contro Stockfish a forza limitata. Il ± è il margine al 95%: con poche decine di partite è largo. Gen-3, gen-4 e gen-5 cadono tutte nella fascia colorata, quindi per ora non si vede né un calo né una crescita.',
				'Measured by playing the champion against strength-limited Stockfish. The ± is the 95% margin: with a few dozen games it is wide. Gen-3, gen-4 and gen-5 all fall in the shaded band, so for now there is neither a drop nor a rise to see.'
			);
			const GAIN_TIP = () => T(
				'Il guadagno viene dal match diretto contro il campione precedente: dice solo che la nuova versione batte la vecchia, non quanto è forte in assoluto. Guadagni piccoli contro se stessi spesso non si vedono contro avversari diversi.',
				'The gain comes from the head-to-head match against the previous champion: it only says the new version beats the old one, not how strong it is overall. Small gains against itself often do not show against other opponents.'
			);
			function lichessPerf(g) {
				const [games, w, d, l, perf] = g.lichess;
				if (games < 5) return T(`Lichess: ${games} ${games === 1 ? 'partita' : 'partite'}, troppo poche per una stima`, `Lichess: ${games} ${games === 1 ? 'game' : 'games'}, too few for an estimate`);
				return T(`Lichess: ${n(perf)} di performance in ${games} partite`, `Lichess: ${n(perf)} performance over ${games} games`);
			}

			// Navigation bar: the brand always there (the decision F), except in X's Diretta.
			function nav() {
				const pages = [['diretta', 'Diretta', 'Live'], ['evoluzione', 'Evoluzione', 'Evolution'], ['codice', 'Codice', 'Code'], ['mente', 'Mente', 'Mind'], ['laboratorio', 'Laboratorio', 'Lab']];
				const brand = S.v === 'x' && S.page === 'diretta' ? '' : `<a class="brand" data-go="diretta" href="#">darwin-chess</a>`;
				return `${brand}<div class="tabs">${pages.map(([k, it, en]) => `<a ${['diretta', 'evoluzione'].includes(k) ? `data-go="${k}"` : 'class="inert"'} ${S.page === k ? 'aria-current="page"' : ''}>${T(it, en)}</a>`).join('')}</div>
				<div class="lang" role="group"><button data-lang="it" aria-pressed="${S.lang === 'it'}">IT</button><span>|</span><button data-lang="en" aria-pressed="${S.lang === 'en'}">EN</button></div>`;

			// X: today, faithful.

					...GENS.filter((g) => !g.seed).map((g) => `<li><span class="id">gen-${g.id}</span><span style="min-width:0"><b class="trunc">${esc(tx(g.hyp))}</b><span class="sub trunc">${g.vsRandom ? T('batte il casuale', 'beats random') : `+${n(g.gain)} Elo`} · ${g.tried} ${T(g.tried === 1 ? 'tentativo' : 'tentativi', g.tried === 1 ? 'attempt' : 'attempts')}</span></span><span class="v num">${g.abs ? n(g.abs) : ''}</span></li>`),

				const spark = (() => {

					const x = (i) => 4 + ((W - 8) * i) / (pts.length - 1), y = (v) => 6 + (H - 12) * (1 - (v - lo) / (hi - lo));

					return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="margin-top:14px"><path d="${line} L${x(pts.length - 1)},${H} L${x(0)},${H} Z" fill="var(--live)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--live)" stroke-width="2"/><circle cx="${x(pts.length - 1)}" cy="${y(pts.at(-1))}" r="3.5" fill="var(--live)"/></svg>`;

					: lichessList(LICHESS, true);
				return `<div class="live3 wrap">
					<header class="top topbar"><span style="font-size:17px;font-weight:700">darwin-chess</span>
						<span class="gen" style="border-left:1px solid var(--border);padding-left:16px"><b>${T('Generazione 5', 'Generation 5')}</b><span class="label">${T('in gara il candidato per la 6', 'the candidate for 6 is racing')}</span></span>
						<span class="pill bad"><i class="dot pulse"></i>${T('In diretta', 'Live')}</span>
						<span class="phase"><span class="phasebar"><i class="on"></i><i class="on"></i><i class="on"></i><i></i></span><span>${T('Fase 3 di 4', 'Phase 3 of 4')} · <b style="color:var(--fg)">${T('Evoluzione', 'Evolution')}</b></span></span>
					</header>
					<aside class="col left">
						<section class="card"><p class="label" style="margin-bottom:10px">${T('Come sta andando', 'How it is going')}</p>
							<p class="bigelo"><b class="num">${n(1129)}</b><span class="mono label">Elo · gen-5</span></p>${spark}
							<p class="label" style="font-size:12px;margin-top:12px">${T('Lichess: <b style="color:var(--fg);font-weight:500">1134</b> di performance in 8 partite di gen-5', 'Lichess: <b style="color:var(--fg);font-weight:500">1134</b> performance over 8 games of gen-5')}</p></section>
						<ol class="hist">${hist}</ol>
						<p class="label" style="font-size:12px;padding:0 10px">${T('18 tentativi, 5 promossi', '18 attempts, 5 promoted')}</p>
					</aside>
					<div class="stage">
						<div class="boardbox" style="display:grid;gap:12px">
							<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px">${tabs()}${S.tab === 'arena' ? `<p class="label"><b style="color:var(--fg);font-weight:600">${T('Giudizio', 'Trial')}</b> · ${T('candidato #18 contro il campione gen-5', 'candidate #18 vs champion gen-5')}</p>` : ''}</div>
							${S.tab === 'arena' ? game({ points: true }) : lichessGame()}
						</div>
						<div class="caption" style="margin:0 auto"><p class="eyebrow" style="margin-bottom:8px"><i class="dot" style="display:inline-block;background:var(--live);width:6px;height:6px;margin-right:6px"></i>${T('Ultimo pensiero', 'Last thought')}</p>
							<p class="t clamp3" lang="en">${esc(plain(THOUGHT_X))}</p><p class="meta">submit · 14:27</p>${S.lang === 'it' ? '<p class="label" style="font-size:12px;margin-top:6px">L’agente pensa e scrive in inglese, la lingua in cui lavora.</p>' : ''}</div>
						<div class="below" style="margin:0 auto">${list}</div>
					</div>
					<aside class="col right">

						${spendCard()}

			function tabs() {

				return `<div class="live3 wrap">

			function eloCardA() {

					const open = S.open[key];
					const sub = e.gen ? T(`è diventato gen-${e.gen}`, `became gen-${e.gen}`) : e.gate ? `${T('fermato a', 'stopped at')} «${tx(GATE[e.gate])}»${e.m ? ` · ${sgn(e.m[3])} ± ${e.m[4]}` : ''}` : `25 nov, ${e.at}`;
					return `<li class="xrow ${open ? 'open' : ''}"><button class="erow" data-open="${key}" aria-expanded="${!!open}"><span class="id">#${e.id}</span><span style="min-width:0"><b class="trunc" style="${e.title ? '' : 'color:var(--muted-fg)'}">${titleOf(e)}</b><span class="sub trunc">${sub}</span></span>${pill(e.st)}${chev}</button><div class="detail">${expDetail(e)}</div></li>`;
				}).join('');
				return `<div class="wrap"><header class="page-head"><h1>${T('Evoluzione', 'Evolution')}</h1><p>${T('Ogni generazione è una modifica dell’agente che ha battuto il campione in carica. Apri una riga per i dettagli.', 'Each generation is a change by the agent that beat the reigning champion. Open a row for the details.')}</p></header>
				<div class="evo2"><section><h2 class="h2">${T('Le generazioni', 'The generations')}</h2>
					<div class="card" style="margin-bottom:14px"><p class="label" style="display:flex;align-items:center;gap:6px;margin-bottom:8px">${T('Elo contro Stockfish, con margine al 95%', 'Elo against Stockfish, with 95% margin')} ${why(ELO_TIP())}</p>${eloChart({ w: 560, h: 170, axis: true, band: true })}</div>
					<ol style="display:grid;gap:2px">${gens}</ol></section>
				<section><h2 class="h2">${T('Tutti gli esperimenti', 'All experiments')} <span class="mut" style="font-weight:400;font-size:15px">${EXPS.length}</span></h2>
					<div class="filters"><div class="seg small">${FILTERS.map(([k, it, en]) => `<button data-filter="${k}" aria-pressed="${S.evoFilter === k}">${T(it, en)} <span class="mono mut">${EXPS.filter((e) => { const f = S.evoFilter; S.evoFilter = k; const r = matchFilter(e); S.evoFilter = f; return r; }).length}</span></button>`).join('')}</div></div>
					<ol style="display:grid;gap:2px">${exps}</ol>
					<div class="pager"><span>${T(`${page * per + 1}-${Math.min(list.length, page * per + per)} di ${list.length}`, `${page * per + 1}-${Math.min(list.length, page * per + per)} of ${list.length}`)}</span><div><button data-page="-1" ${page === 0 ? 'disabled' : ''}>${T('Più recenti', 'Newer')}</button><button data-page="1" ${page >= pages - 1 ? 'disabled' : ''}>${T('Più vecchi', 'Older')}</button></div></div>
				</section></div></div>`;
			}

			// B: experiments live inside the generation they led to.
			function groups() {
				// Experiments between gen-(N-1)'s promotion and gen-N's, plus the ones still open.
				const byGen = { open: [16, 17, 18], 5: [14, 15], 4: [13], 3: [6, 7, 8, 9, 10, 11, 12], 2: [4, 5], 1: [2, 3], 0: [1] };
				return byGen;
			}
			function evoB() {
				const by = groups();
				const att = (ids, key) => ids.map((id) => {
					const e = EXPS.find((x) => x.id === id);
					const c = { good: 'var(--good)', bad: 'var(--bad)', live: 'var(--live)', mut: 'var(--muted-fg)' }[STATUS[e.st][1]];
					return `<button class="att ${S.attempt[key] === id ? 'on' : ''}" data-att="${key}:${id}"><i style="background:${c}"></i><span class="mono">#${id}</span>${e.title ? `<span class="trunc" style="max-width:180px">${tx(e.title)}</span>` : ''}</button>`;
				}).join('');
				const attDetail = (key) => {
					const id = S.attempt[key];
					if (!id) return '';
					const e = EXPS.find((x) => x.id === id);
					return `<div class="attdetail"><p style="display:flex;align-items:center;gap:10px"><b style="font-size:14px">#${e.id} ${titleOf(e)}</b>${pill(e.st)}</p>${expDetail(e)}</div>`;
				};
				const open = `<section class="card gcard" style="box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--live) 40%,var(--border))"><header><div><p class="label"><span class="live mono" style="font-weight:500">gen-6</span> · ${T('in lavorazione', 'in the making')}</p><h3 style="margin-top:4px">${T('Tre tentativi aperti', 'Three open attempts')}</h3></div><div class="elo"><span>${T('#18 in giudizio da', '#18 on trial since')} ${RUN.since}</span></div></header><div class="attempts">${att(by.open.slice().reverse(), 'open')}</div>${attDetail('open')}</section>`;
				const cards = GENS.map((g, i) => {
					const key = `g${g.id}`;
					const ids = by[g.id].slice().reverse();
					return `<section class="card gcard"><header><div style="min-width:0"><p class="label"><span class="mono ${i === 0 ? 'live' : ''}" style="font-weight:500;${i ? 'color:var(--fg)' : ''}">gen-${g.id}</span>${i === 0 ? ` · <span class="live">${T('campione', 'champion')}</span>` : ''} · 25 nov, ${g.at}</p><h3 style="margin-top:4px">${tx(g.title)}</h3>
						${g.seed ? '' : `<p class="label" style="font-size:12px;margin-top:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">${g.vsRandom ? T('batte il giocatore casuale', 'beats the random player') : T(`${sgn(g.gain)} ± ${n(g.gainErr)} sul campione precedente`, `${sgn(g.gain)} ± ${n(g.gainErr)} over the previous champion`)} ${why(GAIN_TIP())} · ${lichessPerf(g)}</p>`}
						${g.plain ? `<p class="note" style="margin-top:10px;color:var(--muted-fg)">«${tx(g.plain)}» <span style="font-size:12px">${T('nota dell’agente', 'the agent’s note')}</span></p>` : ''}</div>
						<div class="elo">${g.abs ? `<b class="num">${n(g.abs)}</b><span>± ${g.absErr} Elo</span>` : g.seed ? '' : `<span>${T('Elo non misurato', 'Elo not rated')}</span>`}</div></header>
						${ids.length ? `<p class="label" style="font-size:12px;padding:0 20px 8px">${g.seed ? T('Prima, le regole:', 'Before it, the rules:') : T(`${ids.length === 1 ? 'Un tentativo' : `${ids.length} tentativi`} per arrivarci:`, `${ids.length === 1 ? 'One attempt' : `${ids.length} attempts`} to get here:`)}</p><div class="attempts">${att(ids, key)}</div>${attDetail(key)}` : ''}</section>`;
				}).join('');
				return `<div class="wrap" style="max-width:1040px"><header class="page-head"><h1>${T('Evoluzione', 'Evolution')}</h1><p>${T('Ogni generazione con i tentativi che l’hanno preceduta. Tocca un tentativo per sapere com’è andato.', 'Each generation with the attempts that came before it. Tap an attempt to see how it went.')}</p></header>
					<div class="card" style="margin-bottom:18px"><div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px"><p class="label" style="display:flex;align-items:center;gap:6px">${T('Elo contro Stockfish, con margine al 95%', 'Elo against Stockfish, with 95% margin')} ${why(ELO_TIP())}</p><p class="label" style="font-size:12px">${T('gen-1 e gen-2 erano troppo deboli per la scala', 'gen-1 and gen-2 were too weak for the ladder')}</p></div>${eloChart({ w: 980, h: 170, axis: true, band: true })}</div>
					<div class="gens-b">${open}${cards}</div></div>`;
			}

			// C: a lab notebook. Chart, then one filterable table.
			function evoC() {
				const list = EXPS.filter(matchFilter);
				const per = 10, pages = Math.max(1, Math.ceil(list.length / per));
				const page = Math.min(S.evoPage, pages - 1);
				const slice = list.slice(page * per, page * per + per);
				const rows = slice.map((e) => {
					const key = `e${e.id}`;
					const result = e.gen ? `<span class="good" style="font-weight:500">gen-${e.gen}</span>` : e.m ? `<span class="mono">${sgn(e.m[3])} ± ${e.m[4]}</span>` : e.gate ? `<span class="mut">${tx(GATE[e.gate])}</span>` : '<span class="mut">–</span>';
					return `<tr class="click" data-open="${key}"><td class="mono mut">#${e.id}</td><td><b style="font-weight:500;${e.title ? '' : 'color:var(--muted-fg)'}">${titleOf(e)}</b></td><td>${pill(e.st)}</td><td class="ra hide-s">${result}</td><td class="ra mono mut hide-s">${e.at}</td></tr>${S.open[key] ? `<tr class="det"><td colspan="5"><div style="display:grid;gap:10px">${expDetail(e)}</div></td></tr>` : ''}`;
				}).join('');
				const gens = GENS.filter((g) => !g.seed).map((g, i) => `<tr class="click" data-open="g${g.id}"><td class="mono ${i === 0 ? 'live' : ''}" style="font-weight:500">gen-${g.id}</td><td><b style="font-weight:500">${tx(g.title)}</b></td><td class="ra mono">${g.abs ? `${n(g.abs)} <span class="mut">± ${g.absErr}</span>` : '<span class="mut">–</span>'}</td><td class="ra mono hide-s">${g.vsRandom ? T('casuale', 'random') : sgn(g.gain)} <span class="mut">± ${n(g.gainErr)}</span></td><td class="ra mono hide-s">${g.lichess[0] >= 5 ? n(g.lichess[4]) : '<span class="mut">–</span>'}</td></tr>${S.open['g' + g.id] ? `<tr class="det"><td colspan="5"><div style="display:grid;gap:10px">${genDetail(g)}</div></td></tr>` : ''}`).join('');
				return `<div class="evo-c"><header class="page-head" style="margin:0"><h1>${T('Evoluzione', 'Evolution')}</h1><p>${T('Il quaderno del laboratorio: quanto è forte ogni generazione, e ogni tentativo con il suo esito.', 'The lab notebook: how strong each generation is, and every attempt with its outcome.')}</p></header>
					<section class="card"><p class="label" style="display:flex;align-items:center;gap:6px;margin-bottom:8px">${T('Elo contro Stockfish, con margine al 95%', 'Elo against Stockfish, with 95% margin')} ${why(ELO_TIP())}</p>${eloChart({ w: 900, h: 180, axis: true, band: true })}<p class="label" style="font-size:12px;margin-top:8px">${T('La fascia è dove le tre misure si sovrappongono: 1.054-1.265. Finché non ne esce, il motore non è misurabilmente cambiato contro avversari esterni.', 'The band is where the three measures overlap: 1,054-1,265. Until a point leaves it, the engine has not measurably changed against outside opponents.')}</p></section>
					<section><h2 class="h2">${T('Generazioni', 'Generations')}</h2><table class="tbl"><thead><tr><th></th><th></th><th class="ra">${T('Stockfish', 'Stockfish')}</th><th class="ra hide-s"><span style="display:inline-flex;align-items:center;gap:6px">${T('sul precedente', 'over previous')} ${why(GAIN_TIP())}</span></th><th class="ra hide-s">Lichess</th></tr></thead><tbody>${gens}</tbody></table></section>
					<section><div style="display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px"><h2 class="h2" style="margin:0">${T('Tentativi', 'Attempts')}</h2><div class="seg small">${FILTERS.map(([k, it, en]) => `<button data-filter="${k}" aria-pressed="${S.evoFilter === k}">${T(it, en)}</button>`).join('')}</div></div>
					<table class="tbl"><thead><tr><th style="width:44px"></th><th></th><th></th><th class="ra hide-s">${T('esito', 'outcome')}</th><th class="ra hide-s">${T('ora', 'time')}</th></tr></thead><tbody>${rows}</tbody></table>
					<div class="pager"><span>${T(`${page * per + 1}-${Math.min(list.length, page * per + per)} di ${list.length}`, `${page * per + 1}-${Math.min(list.length, page * per + per)} of ${list.length}`)}</span><div><button data-page="-1" ${page === 0 ? 'disabled' : ''}>${T('Più recenti', 'Newer')}</button><button data-page="1" ${page >= pages - 1 ? 'disabled' : ''}>${T('Più vecchi', 'Older')}</button></div></div></section></div>`;
			}

			function render() {
				const v = S.v;
				document.querySelector('[data-nav]').innerHTML = nav();
				document.documentElement.lang = S.lang;
				const live = { x: liveX, a: liveA, b: liveB, c: liveC }[v];
				const evo = { x: evoX, a: evoA, b: evoB, c: evoC }[v];
				document.querySelector('[data-main]').innerHTML = S.page === 'diretta' ? live() : evo();
				document.querySelectorAll('[data-scroll]').forEach((el) => (el.scrollTop = el.scrollHeight, el.scrollLeft = el.scrollWidth));
			}

			// Interactions inside the mock.
			document.addEventListener('click', (e) => {
				const t = e.target.closest('[data-go],[data-lang],[data-tab],[data-more],[data-open],[data-filter],[data-page],[data-feed],[data-att],a[href="#"]');
				if (!t) return;
				e.preventDefault();
				if (t.dataset.go) { S.page = t.dataset.go; S.liveMore = false; scrollTo(0, 0); }
				else if (t.dataset.lang) S.lang = t.dataset.lang;
				else if (t.dataset.tab) { S.tab = t.dataset.tab; S.liveMore = false; }
				else if (t.hasAttribute('data-more')) S.liveMore = true;
				else if (t.dataset.open) S.open[t.dataset.open] = !S.open[t.dataset.open];
				else if (t.dataset.filter) { S.evoFilter = t.dataset.filter; S.evoPage = 0; }
				else if (t.dataset.page) S.evoPage = Math.max(0, S.evoPage + +t.dataset.page);
				else if (t.dataset.feed) S.feed = t.dataset.feed;
				else if (t.dataset.att) { const [k, id] = t.dataset.att.split(':'); S.attempt[k] = S.attempt[k] === +id ? null : +id; }
				else return;
				render();
			});

			// Concept chrome, from the template.
			const KEY = `concept:${location.pathname}`;
			const root = document.documentElement;
			const body = document.body;
			const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch { return {}; } };
			const save = (state) => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
			const name = (v) => DESC[v].split(':')[0];
			document.querySelector('[data-buttons]').innerHTML = Object.keys(DESC).map((v) => `<button data-v="${v}">${v.toUpperCase()} ${name(v)}</button>`).join(' ');
			const pick = (v) => {
				if (!DESC[v]) return;
				S.v = v;
				body.dataset.v = v;
				document.querySelectorAll('.switch [data-v]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
				document.querySelector('[data-desc]').textContent = DESC[v];
				history.replaceState(null, '', `${location.search}#${v}`);
				render();
			};
			const setTheme = (t) => { root.dataset.theme = t; save({ ...load(), theme: t }); };
			document.querySelector('.switch').addEventListener('click', (e) => { const b = e.target.closest('[data-v]'); if (b) pick(b.dataset.v); });
			document.querySelector('[data-theme-toggle]').addEventListener('click', () => setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'));
			addEventListener('keydown', (e) => {
				if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, select, [contenteditable]')) return;
				const k = e.key.toLowerCase();
				if (k === 't') setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
				else if (k === 'p') body.dataset.chrome = body.dataset.chrome === 'off' ? 'on' : 'off';
				else pick(k);
			});
			root.dataset.theme = load().theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
			// Query parameters open a given state directly: ?page=evoluzione&lang=en&theme=dark&w=390.
			const Q = new URLSearchParams(location.search);
			if (Q.get('page')) S.page = Q.get('page');
			if (Q.get('lang')) S.lang = Q.get('lang');
			if (Q.get('theme')) root.dataset.theme = Q.get('theme');
			if (Q.get('chrome') === 'off') body.dataset.chrome = 'off';
			pick(DESC[location.hash.slice(1)] ? location.hash.slice(1) : 'x');
		</script>
	</body>
</html>
